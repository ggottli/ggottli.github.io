# Jekyll config — only used for the blog (/writing.html and _posts/).
# Every other file on the site has no front matter, so Jekyll copies it
# through untouched.
title: Greg Gottlieb
url: "https://ggottlieb.com"
timezone: America/New_York
markdown: kramdown
permalink: /writing/:year/:title.html
exclude:
  - new-post.sh
  - README.md
  - scripts/
  - docs/
