<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% if page.title %}{{ page.title }} | Greg Gottlieb{% else %}Greg Gottlieb{% endif %}</title>
        {% if page.excerpt %}
        <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}" />
        {% endif %}
        <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}Greg Gottlieb{% endif %}" />
        {% if page.excerpt %}
        <meta property="og:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}" />
        {% endif %}
        <meta property="og:image" content="https://ggottlieb.com/assets/carmel-sunset.jpeg" />
        <meta property="og:image:width" content="1024" />
        <meta property="og:image:height" content="768" />
        <meta property="og:url" content="https://ggottlieb.com{{ page.url }}" />
        <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="stylesheet" href="/assets/writing.css" />
    </head>
    <body>
        <header>
            <a class="site-title" href="/">ggottlieb.com</a>
            <nav>
                <a href="/writing.html">Writing</a>
                <a href="/photos.html">Photos</a>
            </nav>
        </header>
        <main>{{ content }}</main>
        <footer>
            <p>&copy; {{ site.time | date: "%Y" }} Greg Gottlieb</p>
        </footer>
    </body>
</html>
