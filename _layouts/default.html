<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% if page.title %}{{ page.title }} | Greg Gottlieb{% else %}Greg Gottlieb{% endif %}</title>
        {% if page.excerpt %}
        <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}" />
        {% endif %}
        <link rel="stylesheet" href="/assets/writing.css" />
    </head>
    <body>
        <header>
            <a class="site-title" href="/">ggottlieb.com</a>
            <nav>
                <a href="/writing.html">Writing</a>
                <a href="/photos.html">Photos</a>
            </nav>
        </header>
        <main>{{ content }}</main>
        <footer>
            <p>&copy; {{ site.time | date: "%Y" }} Greg Gottlieb</p>
        </footer>
    </body>
</html>
