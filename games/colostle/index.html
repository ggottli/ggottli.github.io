<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colostle Companion</title>
<meta name="description" content="A personal companion app for playing Nich Angell’s Colostle solo RPG: deck, character sheet, combat and journal.">
<meta name="theme-color" content="#0d2a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Colostle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 36V14h4v-4h4v4h8v-4h4v4h4v22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 36v-9a4 4 0 0 1 8 0v9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M4 36h32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M20 4l6 6H14z" fill="currentColor"/></svg>
      <div><div class="t">Colostle</div><div class="s">Companion</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="syncfoot">Saved in this browser — export a save file, or connect sync, to play on other devices</div>
      <div style="margin-top:6px">Rules summarised from Nich Angell’s <em>Colostle</em>, <em>The Roomlands</em> and <em>Elite Rookhunting</em>. Keep the books for the full text and art.</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content" id="main"></div>
  </div>
</div>
<nav class="mobilebar" id="mobilebar"></nav>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/help.js"></script>
<script src="js/sync.js"></script>
<script src="js/shell.js"></script>
<script src="js/character.js"></script>
<script src="js/explore.js"></script>
<script src="js/combat.js"></script>
<script src="js/journal.js"></script>
<script>
// Offline support: install the service worker (not on file:// where it cannot run).
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound', ()=>{ const w=reg.installing; if(!w) return; w.addEventListener('statechange', ()=>{ if(w.state==='installed' && navigator.serviceWorker.controller && typeof toast==='function') toast('Companion updated — reload to use the new version'); }); });
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
