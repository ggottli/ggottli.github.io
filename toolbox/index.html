tool({
  id:"pace", cat:"Everyday", name:"Pace calculator",
  desc:"Fill in any two of distance, time and pace — the blank one gets solved.",
  kw:"running run race 5k 10k half marathon pace speed split finish time",
  html:`<div class="panel">
    <div class="row3">
      <div class="field"><label class="f">Distance</label><input type="text" id="pa-d" value="10" inputmode="decimal" placeholder="10"></div>
      <div class="field"><label class="f">Total time</label><input type="text" id="pa-t" placeholder="45:30 or 1:02:15"></div>
      <div class="field"><label class="f" id="pa-pl">Pace (min/km)</label><input type="text" id="pa-p" placeholder="5:30"></div>
    </div>
    <div class="row2">
      <div class="field"><label class="f">Units</label><select id="pa-u"><option value="km">kilometers</option><option value="mi">miles</option></select></div>
      <div class="field" style="align-self:end"><button class="act" id="pa-go" style="width:100%">Solve the blank one</button></div>
    </div>
    <div class="note" id="pa-note">Leave exactly one field blank. Time reads 1:02:15 as h:mm:ss, 45:30 as mm:ss, plain 45 as minutes.</div>
    <div class="stat-grid" id="pa-out"></div></div>
  <div class="panel" id="pa-races" hidden>
    <label class="f">Finish times at that pace</label>
    <div id="pa-tbl"></div>
    <div class="note">Assumes you hold the pace the whole way. Race day tends to have opinions about that.</div></div>`,
  wire(root){
    const $=s=>root.querySelector(s);
    function parseClock(s){
      s=String(s||"").trim();
      if(s==="") return null;
      if(/^(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s)*60;
      const m=s.match(/^(\d+):([0-5]?\d)(?::([0-5]?\d))?$/);
      if(!m) return NaN;
      return m[3]!==undefined ? (+m[1]*3600 + +m[2]*60 + +m[3]) : (+m[1]*60 + +m[2]);
    }
    const fmtT=sec=>{ sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
      return (h ? h+":"+String(m).padStart(2,"0") : String(m)) + ":" + String(s).padStart(2,"0"); };
    $("#pa-u").addEventListener("change", ()=>{ $("#pa-pl").textContent = "Pace (min/"+$("#pa-u").value+")"; });
    $("#pa-go").addEventListener("click", ()=>{
      const unit=$("#pa-u").value;
      const dRaw=$("#pa-d").value.trim(), tRaw=$("#pa-t").value.trim(), pRaw=$("#pa-p").value.trim();
      let dist = dRaw==="" ? null : (/^(\d+\.?\d*|\.\d+)$/.test(dRaw) ? parseFloat(dRaw) : NaN);
      let time = parseClock(tRaw), pace = parseClock(pRaw);
      const bad = [["distance",dist],["time",time],["pace",pace]].filter(([,x])=>Number.isNaN(x)).map(([n])=>n);
      const out=$("#pa-out"), note=$("#pa-note");
      if(bad.length){ out.innerHTML=""; $("#pa-races").hidden=true;
        note.innerHTML = `<span class="err">Couldn't read the ${esc(bad.join(" and "))} — try 45:30, 1:02:15, or plain minutes.</span>`; return; }
      const blanks=[dist,time,pace].filter(x=>x===null).length;
      if(blanks>1){ out.innerHTML=""; $("#pa-races").hidden=true;
        note.textContent="Fill in any two — distance, time or pace — and the third gets worked out."; return; }
      if(blanks===0){ out.innerHTML=""; $("#pa-races").hidden=true;
        note.textContent="All three are filled — clear the one you want worked out."; return; }
      if(dist===null){ dist = time/pace; $("#pa-d").value = String(Math.round(dist*1000)/1000); }
      else if(time===null){ time = dist*pace; $("#pa-t").value = fmtT(time); }
      else { pace = time/dist; $("#pa-p").value = fmtT(pace); }
      if(!(dist>0 && time>0 && pace>0)){ out.innerHTML=""; $("#pa-races").hidden=true;
        note.textContent="Something there is zero — nobody runs that fast (or that far)."; return; }
      const speed = dist/(time/3600);
      const S=(v,l)=>`<div class="stat"><span class="n">${v}</span><span class="l">${l}</span></div>`;
      out.innerHTML = S(fmtT(pace),"per "+unit)+S(fmtT(time),"total time")+
        S(fmtN(dist,3)+" "+unit,"distance")+S(fmtN(speed,2)+" "+(unit==="km"?"km/h":"mph"),"speed");
      note.textContent="";
      const races=[["5K",5],["10K",10],["Half marathon",21.0975],["Marathon",42.195]];
      const rows=races.map(([nm,km])=>{
        const d = unit==="mi" ? km/1.609344 : km;
        return `<tr><td>${nm}</td><td>${fmtN(d,2)} ${unit}</td><td>${fmtT(d*pace)}</td></tr>`;
      }).join("");
      $("#pa-tbl").innerHTML = `<table class="tbl"><thead><tr><th>Race</th><th>Distance</th><th>Finish</th></tr></thead><tbody>${rows}</tbody></table>`;
      $("#pa-races").hidden=false;
    });
  }
});

tool({
  id:"picker", cat:"Everyday", name:"Random picker",
  desc:"Paste a list, draw a fair winner — or shuffle the whole thing into order.",
  kw:"raffle winner draw names hat lottery choose giveaway shuffle decide",
  html:`<div class="panel">
    <label class="f">The hat (one entry per line)</label>
    <textarea id="pk-in" placeholder="Alice&#10;Bob&#10;Carol&#10;…"></textarea>
    <div class="btnrow">
      <button class="act" id="pk-one">Draw a winner</button>
      <input type="number" id="pk-n" value="3" min="1" style="width:80px" title="how many to draw">
      <button class="act ghost" id="pk-many">Draw that many (no repeats)</button>
      <button class="act ghost" id="pk-shuf">Shuffle into order</button>
    </div>
    <div class="result big" id="pk-win" hidden></div>
    <div class="result" id="pk-list" hidden></div>
    <div class="note" id="pk-note">The hat is empty.</div></div>`,
  wire(root){
    const $=s=>root.querySelector(s);
    const entries=()=>$("#pk-in").value.split("\n").map(l=>l.trim()).filter(Boolean);
    function ri(n){ // unbiased crypto integer in [0, n)
      const lim=Math.floor(4294967296/n)*n, buf=new Uint32Array(1);
      let r; do{ crypto.getRandomValues(buf); r=buf[0]; }while(r>=lim);
      return r%n;
    }
    function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=ri(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    const countMsg=n=>n+" entr"+(n===1?"y":"ies")+" in the hat.";
    function updateCount(){ const n=entries().length; $("#pk-note").textContent = n? countMsg(n) : "The hat is empty."; }
    $("#pk-in").addEventListener("input", updateCount);
    function need(){ const e=entries(); if(!e.length){ $("#pk-win").hidden=true; $("#pk-list").hidden=true;
      $("#pk-note").textContent="Nothing in the hat yet — add some lines above."; } return e; }
    $("#pk-one").addEventListener("click", ()=>{
      const e=need(); if(!e.length) return;
      $("#pk-win").hidden=false; $("#pk-list").hidden=true;
      $("#pk-win").textContent = e[ri(e.length)];
      $("#pk-note").textContent = "Drawn fairly from "+countMsg(e.length);
    });
    $("#pk-many").addEventListener("click", ()=>{
      const e=need(); if(!e.length) return;
      const n=Math.min(e.length, Math.max(1, Math.floor(+$("#pk-n").value)||1));
      const picks=shuffled(e).slice(0,n);
      $("#pk-win").hidden=true; $("#pk-list").hidden=false;
      $("#pk-list").textContent = picks.map((p,i)=>(i+1)+". "+p).join("\n");
      $("#pk-note").textContent = "Drew "+n+" without repeats from "+countMsg(e.length)+
        (n===e.length? " That's everyone." : "");
    });
    $("#pk-shuf").addEventListener("click", ()=>{
      const e=need(); if(!e.length) return;
      $("#pk-win").hidden=true; $("#pk-list").hidden=false;
      $("#pk-list").textContent = shuffled(e).map((p,i)=>(i+1)+". "+p).join("\n");
      $("#pk-note").textContent = "A full random ordering of "+countMsg(e.length);
    });
    updateCount();
  }
});

tool({
  id:"recipe-scaler", cat:"Everyday", name:"Recipe scaler",
  desc:"Scale ingredient quantities for a different number of servings.",
  kw:"cooking baking ingredients portions servings fractions kitchen",
  html:`<div class="panel">
    <div class="row2">
      <div class="field"><label class="f" for="rs-from">Original servings</label><input type="number" id="rs-from" value="4" min="0.01" step="any"></div>
      <div class="field"><label class="f" for="rs-to">Wanted servings</label><input type="number" id="rs-to" value="6" min="0.01" step="any"></div>
    </div>
    <div class="field"><label class="f" for="rs-in">Ingredients — one per line</label><textarea id="rs-in" placeholder="2 cups flour&#10;1 1/2 tsp baking powder&#10;1–2 lemons&#10;Salt to taste">2 cups flour
1 1/2 tsp baking powder
1/2 tsp salt
1–2 lemons</textarea></div>
    <div class="result" id="rs-out"></div>
    <div class="btnrow"><button class="act ghost" id="rs-copy">copy scaled recipe</button></div>
    <div class="note" id="rs-note" role="status" aria-live="polite">Whole numbers, decimals, common fractions and quantity ranges are understood. Lines without a leading quantity stay unchanged.</div>
  </div>`,
  wire(root){
    const $=s=>root.querySelector(s);
    const note=$("#rs-note"),say=text=>{ if(note.textContent!==text) note.textContent=text; };
    const unicode={"¼":1/4,"½":1/2,"¾":3/4,"⅓":1/3,"⅔":2/3,"⅛":1/8,"⅜":3/8,"⅝":5/8,"⅞":7/8};
    const qty="(?:\\d+\\s*-\\s*\\d+\\s*\\/\\s*\\d+|\\d+\\s+\\d+\\s*\\/\\s*\\d+|\\d+\\s*\\/\\s*\\d+|(?:\\d+(?:\\.\\d+)?|\\.\\d+)?[¼½¾⅓⅔⅛⅜⅝⅞]|(?:\\d+(?:\\.\\d+)?|\\.\\d+))";
    const lineRx=new RegExp("^(\\s*)("+qty+")(?:(?:\\s*(?:[–—-]|\\bto\\b)\\s*)("+qty+"))?(\\s+.*)?$","i");
    function readQty(s){
      s=s.trim().replace(/\s*\/\s*/g,"/").replace(/^(\d+)\s*-\s*(\d+\/\d+)$/,"$1 $2");
      let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
      if(m) return +m[3] ? +m[1] + (+m[2]/+m[3]) : NaN;
      m=s.match(/^(\d+)\/(\d+)$/);
      if(m) return +m[2] ? +m[1]/+m[2] : NaN;
      m=s.match(/^(\d+(?:\.\d+)?)?([¼½¾⅓⅔⅛⅜⅝⅞])$/);
      if(m) return (m[1]?+m[1]:0)+unicode[m[2]];
      return Number(s);
    }
    function formatQty(n){
      if(!isFinite(n)) return "—";
      const nearInt=Math.round(n);
      if(Math.abs(n-nearInt)<1e-6) return String(nearInt);
      let whole=Math.floor(n), frac=n-whole;
      let best=null;
      for(let den=2;den<=16;den++){
        const num=Math.round(frac*den), err=Math.abs(frac-num/den);
        if(num && (!best||err<best.err)) best={num,den,err};
      }
      if(best && best.err<1e-6){
        let num=best.num,den=best.den;
        whole+=Math.floor(num/den); num%=den;
        if(!num) return String(whole);
        let a=num,b=den;
        while(b){ const t=b; b=a%b; a=t; }
        num/=a; den/=a;
        return (whole?whole+" ":"")+num+"/"+den;
      }
      return String(Math.round(n*1000)/1000);
    }
    function run(){
      const from=+$("#rs-from").value, to=+$("#rs-to").value;
      if(!(from>0&&to>0&&isFinite(from)&&isFinite(to))){
        $("#rs-out").textContent="";
        say("Enter original and wanted serving counts greater than zero. The recipe has not been changed.");
        return;
      }
      const factor=to/from; let scaled=0;
      const lines=$("#rs-in").value.split("\n").map(line=>{
        const m=line.match(lineRx);
        if(!m) return line;
        const first=readQty(m[2]), second=m[3]?readQty(m[3]):null;
        if(!isFinite(first)||(second!==null&&!isFinite(second))) return line;
        scaled++;
        return m[1]+formatQty(first*factor)+(second===null?"":"–"+formatQty(second*factor))+(m[4]||"");
      });
      $("#rs-out").textContent=lines.join("\n");
      say("Scaled "+scaled+" quantified line"+(scaled===1?"":"s")+" by "+fmtN(factor,3)+"×. Unrecognized lines were kept as written.");
    }
    root.addEventListener("input",run);
    $("#rs-copy").addEventListener("click",e=>copyText(e.currentTarget,$("#rs-out").textContent));
    run();
  }
});

tool({
  id:"aspect-ratio", cat:"Convert", name:"Aspect ratio & dimensions",
  desc:"Find an image ratio, resize by one side, or fit it inside a box.",
  kw:"resolution pixels resize dimensions crop contain cover video photo screen",
  html:`<div class="panel">
    <h3 class="f" style="margin-bottom:12px">Source dimensions</h3>
    <div class="row2">
      <div class="field"><label class="f" for="ar-w">Width (px)</label><input type="number" id="ar-w" value="1920" min="1" step="1"></div>
      <div class="field"><label class="f" for="ar-h">Height (px)</label><input type="number" id="ar-h" value="1080" min="1" step="1"></div>
    </div>
    <h3 class="f" style="margin-bottom:12px">Target size</h3>
    <div class="row2">
      <div class="field"><label class="f" for="ar-tw">Width (px)</label><input type="number" id="ar-tw" value="1200" min="1" step="1"></div>
      <div class="field"><label class="f" for="ar-th">Height (px, optional)</label><input type="number" id="ar-th" min="1" step="1" placeholder="leave blank to calculate"></div>
    </div>
    <div class="result big" id="ar-result" aria-live="polite"></div>
    <div class="stat-grid" id="ar-out"></div>
    <div class="note" id="ar-note" role="status" aria-live="polite">Enter one target side to calculate the other. Enter both to compare contain and cover sizing.</div>
  </div>`,
  wire(root){
    const $=s=>root.querySelector(s);
    const S=(v,l)=>`<div class="stat"><span class="n" style="font-size:18px">${v}</span><span class="l">${l}</span></div>`;
    function gcd(a,b){ while(b){ const t=b;b=a%b;a=t; } return a||1; }
    function dims(w,h){ return fmtN(w,0)+" × "+fmtN(h,0)+" px"; }
    function run(){
      const w=+$("#ar-w").value,h=+$("#ar-h").value;
      const tw=$("#ar-tw").value===""?null:+$("#ar-tw").value;
      const th=$("#ar-th").value===""?null:+$("#ar-th").value;
      if(!(w>0&&h>0&&Number.isInteger(w)&&Number.isInteger(h))){
        $("#ar-result").textContent="Enter positive whole-pixel source dimensions."; $("#ar-out").innerHTML=""; return;
      }
      const d=gcd(w,h), ratio=fmtN(w/d,0)+":"+fmtN(h/d,0);
      const orientation=w===h?"square":w>h?"landscape":"portrait";
      if(tw===null&&th===null){
        $("#ar-result").textContent=ratio;
        $("#ar-out").innerHTML=S(orientation,"orientation")+S(fmtN(w/h,4),"decimal ratio");
        $("#ar-note").textContent="Add a target width or height to calculate a resized copy."; return;
      }
      if((tw!==null&&!(tw>0&&Number.isInteger(tw)))||(th!==null&&!(th>0&&Number.isInteger(th)))){
        $("#ar-result").textContent="Enter positive whole-pixel target dimensions."; $("#ar-out").innerHTML=""; return;
      }
      if(tw===null||th===null){
        const scale=tw!==null?tw/w:th/h, outW=tw!==null?tw:w*scale, outH=th!==null?th:h*scale;
        $("#ar-result").textContent=dims(outW,outH);
        $("#ar-out").innerHTML=S(ratio,"source ratio")+S(fmtN(scale*100,2)+"%","source scale")+S(orientation,"orientation");
        $("#ar-note").textContent="The missing side is rounded to the nearest pixel for display."; return;
      }
      const contain=Math.min(tw/w,th/h), cover=Math.max(tw/w,th/h);
      const cw=w*contain,ch=h*contain,vw=w*cover,vh=h*cover;
      const gapX=Math.max(0,tw-cw),gapY=Math.max(0,th-ch);
      const cropX=Math.max(0,vw-tw),cropY=Math.max(0,vh-th);
      const crossA=w*th,crossB=h*tw;
      const same=Math.abs(crossA-crossB)<=Number.EPSILON*8*Math.max(1,Math.abs(crossA),Math.abs(crossB));
      $("#ar-result").textContent=same?dims(tw,th)+" — same ratio":dims(tw,th)+" target box";
      $("#ar-out").innerHTML=S(ratio,"source ratio")+S(dims(cw,ch),"contain")+S(dims(vw,vh),"cover")+
        S(dims(gapX,gapY),"horizontal × vertical gap")+S(dims(cropX,cropY),"horizontal × vertical crop");
      $("#ar-note").textContent=same?"The source and target have the same aspect ratio.":"Contain shows the whole source; cover fills the box and trims the overflow.";
    }
    root.addEventListener("input",run); run();
  }
});

tool({
  id:"workdays", cat:"Everyday", name:"Workday calculator",
  desc:"Count weekdays in a date range or add working days to a date.",
  kw:"business days weekdays office deadline holidays calendar due date",
  html:`<div class="panel">
    <h3 class="f" style="margin-bottom:12px">Count workdays in a range</h3>
    <div class="row2">
      <div class="field"><label class="f" for="wd-start">Start date</label><input type="date" id="wd-start"></div>
      <div class="field"><label class="f" for="wd-end">End date</label><input type="date" id="wd-end"></div>
    </div>
    <div class="stat-grid" id="wd-count" aria-live="polite"></div>
    <div class="note" id="wd-count-note" role="status" aria-live="polite"></div>
  </div>
  <div class="panel">
    <h3 class="f" style="margin-bottom:12px">Add workdays</h3>
    <div class="row2">
      <div class="field"><label class="f" for="wd-add-start">Starting date</label><input type="date" id="wd-add-start"></div>
      <div class="field"><label class="f" for="wd-add-n">Workdays to add</label><input type="number" id="wd-add-n" value="10" min="-10000" max="10000" step="1"></div>
    </div>
    <div class="result big" id="wd-add-out" aria-live="polite"></div>
    <div class="note" id="wd-add-note" role="status" aria-live="polite">The starting date is not counted.</div>
  </div>
  <div class="panel">
    <label class="f" for="wd-holidays">Holidays to skip (optional, one YYYY-MM-DD per line)</label>
    <textarea id="wd-holidays" style="min-height:92px" placeholder="2026-01-01&#10;2026-12-25"></textarea>
    <div class="note" id="wd-holiday-note" role="status" aria-live="polite">Saturday and Sunday are always skipped. Add local or company holidays above.</div>
  </div>`,
  wire(root){
    const $=s=>root.querySelector(s);
    const S=(v,l)=>`<div class="stat"><span class="n">${v}</span><span class="l">${l}</span></div>`;
    function parseDate(s){
      const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null;
      const d=new Date(+m[1],+m[2]-1,+m[3],12);
      return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]?d:null;
    }
    const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const inputDate=d=>key(d);
    const clone=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
    function holidaySet(){
      const dates=[],invalid=[];
      for(const token of $("#wd-holidays").value.split(/[\s,]+/).filter(Boolean)){
        const date=parseDate(token);
        if(date) dates.push(key(date)); else invalid.push(token);
      }
      return {dates:new Set(dates),invalid};
    }
    function isWeekend(d){ return d.getDay()===0||d.getDay()===6; }
    function run(){
      const holidayInfo=holidaySet(),holidays=holidayInfo.dates;
      if(holidayInfo.invalid.length){
        const list=holidayInfo.invalid.slice(0,3).join(", ")+(holidayInfo.invalid.length>3?"…":"");
        $("#wd-holiday-note").textContent="Fix invalid holiday date"+(holidayInfo.invalid.length===1?"":"s")+": "+list+".";
        $("#wd-count").innerHTML=""; $("#wd-count-note").textContent="Fix the holiday list before counting.";
        $("#wd-add-out").textContent="Fix the holiday list first."; $("#wd-add-note").textContent="Use one YYYY-MM-DD date per line.";
        return;
      }
      $("#wd-holiday-note").textContent="Saturday and Sunday are always skipped. Add local or company holidays above.";
      const start=parseDate($("#wd-start").value), end=parseDate($("#wd-end").value);
      if(start&&end){
        let a=clone(start),b=clone(end),reversed=false;
        if(a>b){ [a,b]=[b,a]; reversed=true; }
        const calendarSpan=Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-
          Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000)+1;
        if(calendarSpan>36600){
          $("#wd-count").innerHTML="";
          $("#wd-count-note").textContent="Choose a date range of 100 years or less.";
        }else{
          let calendar=0,weekends=0,holidayHits=0,working=0;
          for(let d=clone(a);d<=b;d.setDate(d.getDate()+1)){
            calendar++;
            if(isWeekend(d)) weekends++;
            else if(holidays.has(key(d))) holidayHits++;
            else working++;
          }
          $("#wd-count").innerHTML=S(fmtN(working,0),"workdays")+S(fmtN(calendar,0),"calendar days")+
            S(fmtN(weekends,0),"weekend days")+S(fmtN(holidayHits,0),"weekday holidays");
          $("#wd-count-note").textContent="Both endpoints are included"+(reversed?"; the dates were counted in chronological order.":".");
        }
      }else{
        $("#wd-count").innerHTML=""; $("#wd-count-note").textContent="Choose both dates to count the range.";
      }
      const addStart=parseDate($("#wd-add-start").value), addText=$("#wd-add-n").value.trim();
      if(!addStart){
        $("#wd-add-out").textContent="Choose a starting date."; $("#wd-add-note").textContent="The starting date is required."; return;
      }
      const raw=Number(addText);
      if(addText===""||!Number.isInteger(raw)||Math.abs(raw)>10000){
        $("#wd-add-out").textContent="Enter a whole number from −10,000 to 10,000."; $("#wd-add-note").textContent="Positive values move forward; negative values move backward."; return;
      }
      let d=clone(addStart),left=Math.abs(raw),step=raw<0?-1:1;
      while(left){ d.setDate(d.getDate()+step); if(!isWeekend(d)&&!holidays.has(key(d))) left--; }
      $("#wd-add-out").textContent=d.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
      $("#wd-add-note").textContent=raw===0?"Zero days added — the starting date is returned as written.":
        fmtN(Math.abs(raw),0)+" workday"+(Math.abs(raw)===1?"":"s")+" "+(raw<0?"before":"after")+" "+addStart.toLocaleDateString()+". The starting date is not counted.";
    }
    const today=new Date(), later=new Date(today.getFullYear(),today.getMonth(),today.getDate()+30,12);
    $("#wd-start").value=inputDate(today); $("#wd-end").value=inputDate(later); $("#wd-add-start").value=inputDate(today);
    root.addEventListener("input",run); run();
  }
});

          } else if(msg==="NO_SPEECH"){
            fail("No speech was detected in that file.","");
          } else if(/import|fetch|network|Failed to fetch|dynamically imported|load/i.test(msg)){
            fail("Couldn't load the transcription engine or model.",
              "This needs a connection for the first run (to fetch the model). Check your network and reload.");
          } else {
            fail("Transcription failed.", msg);
          }
        }finally{
          if(alive){ goBtn.disabled = !currentFile; modelSel.disabled=false; }
        }
      }
      function fail(msg, detail){
        errorBox.innerHTML = "<b>"+esc(msg)+"</b>" + (detail ? "<br>"+esc(detail) : "");
        errorBox.hidden=false;
      }

      // ---- speakers ----
      function refreshSpeakerNames(){
        for(let i=0;i<numSpeakers;i++){ if(!speakerNames[i]) speakerNames[i]="Speaker "+(i+1); }
      }
      function applySpeakerMode(){
        const on = optSpeakers.checked;
        speakerBar.hidden = !on;
        assignHint.hidden = !on;
        if(on) renderSpeakerChips();
      }
      function renderSpeakerChips(){
        speakersEl.innerHTML=""; spCount.textContent=numSpeakers;
        for(let i=0;i<numSpeakers;i++){
          const chip=document.createElement("div"); chip.className="tr-sp-chip";
          const sw=document.createElement("span"); sw.className="tr-sp-swatch"; sw.style.background=colorFor(i);
          const inp=document.createElement("input"); inp.type="text"; inp.value=speakerNames[i];
          inp.setAttribute("aria-label","Name for speaker "+(i+1));
          inp.addEventListener("input", ()=>{ speakerNames[i]=inp.value||"Speaker"; renderTranscript(); buildMarkdown(); });
          chip.appendChild(sw); chip.appendChild(inp); speakersEl.appendChild(chip);
        }
      }
      spPlus.addEventListener("click", ()=>{ if(numSpeakers<8){ numSpeakers++; refreshSpeakerNames(); renderSpeakerChips(); } });
      spMinus.addEventListener("click", ()=>{
        if(numSpeakers>1){ numSpeakers--; paras.forEach(p=>{ if(p.speaker>=numSpeakers) p.speaker=numSpeakers-1; });
          renderSpeakerChips(); renderTranscript(); buildMarkdown(); }
      });
      optSpeakers.addEventListener("change", ()=>{ if(paras.length){ applySpeakerMode(); renderTranscript(); buildMarkdown(); } });
      optTimestamps.addEventListener("change", ()=>{ if(paras.length){ renderTranscript(); buildMarkdown(); } });
      optFrontmatter.addEventListener("change", ()=>{ if(paras.length) buildMarkdown(); });

      // ---- render ----
      function renderTranscript(){
        const labeled = optSpeakers.checked;
        transcriptEl.innerHTML="";
        paras.forEach((p)=>{
          const row=document.createElement("div");
          row.className = "tr-turn " + (labeled ? "labeled" : "plain");
          if(labeled){
            const who=document.createElement("div"); who.className="who";
            const bar=document.createElement("span"); bar.className="bar-c"; bar.style.background=colorFor(p.speaker);
            const nm=document.createElement("span"); nm.style.color=colorFor(p.speaker);
            nm.innerHTML = esc(speakerNames[p.speaker]) + (optTimestamps.checked ? "<span class='ts'>"+fmtTime(p.start)+"</span>" : "");
            who.appendChild(bar); who.appendChild(nm); row.appendChild(who);
            row.title="Click to change speaker";
            row.addEventListener("click", ()=>{ p.speaker=(p.speaker+1)%numSpeakers; renderTranscript(); buildMarkdown(); });
          } else if(optTimestamps.checked){
            const who=document.createElement("div"); who.className="who";
            const nm=document.createElement("span"); nm.className="ts"; nm.style.marginTop="0"; nm.textContent=fmtTime(p.start);
            who.appendChild(nm); row.appendChild(who);
          }
          const say=document.createElement("div"); say.className="say"; say.textContent=p.text;
          row.appendChild(say);
          transcriptEl.appendChild(row);
        });
      }
      function buildMarkdown(){
        const labeled = optSpeakers.checked;
        let md="";
        if(optFrontmatter.checked){
          const today=new Date().toISOString().slice(0,10);
          md+="---\n";
          md+="title: "+meta.filename+"\n";
          md+="date: "+today+"\n";
          md+="source: "+currentFile.name+"\n";
          md+="duration: "+fmtDuration(meta.duration)+"\n";
          if(labeled) md+="speakers: "+numSpeakers+"\n";
          md+="transcribed: "+today+"\n";
          md+="tags:\n  - transcript\n";
          md+="---\n\n";
        }
        md+="# "+meta.filename+"\n\n";
        if(labeled){
          let merged=[];
          paras.forEach(p=>{
            const last=merged[merged.length-1];
            if(last && last.speaker===p.speaker) last.text += " " + p.text;
            else merged.push({ speaker:p.speaker, text:p.text, start:p.start });
          });
          merged.forEach(m=>{
            const ts = optTimestamps.checked ? " `["+fmtTime(m.start)+"]`" : "";
            md+="**"+speakerNames[m.speaker]+"**"+ts+"\n"+m.text+"\n\n";
          });
        } else {
          paras.forEach(p=>{
            const ts = optTimestamps.checked ? "`["+fmtTime(p.start)+"]` " : "";
            md+=ts+p.text+"\n\n";
          });
        }
        rawEl.value = md.trimEnd()+"\n";
      }

      // ---- copy / download ----
      copyBtn.addEventListener("click", ()=>copyText(copyBtn, rawEl.value));
      downloadBtn.addEventListener("click", ()=>{
        const blob=new Blob([rawEl.value],{type:"text/markdown"});
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
        a.download=(meta.filename||"transcript")+".md";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      });
    }
  });
})();

/* ================= boot ================= */
route();

</script>
</body>
</html>
