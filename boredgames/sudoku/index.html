<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku — Bored Games</title>
<meta name="description" content="Sudoku — fill the grid one to nine. Part of Bored Games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  :root{ --accent: var(--nes-purple); --sc:clamp(32px,9.4vw,44px); }
  .diff-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .sudoku{
    display:grid; grid-template-columns:repeat(9,var(--sc)); grid-template-rows:repeat(9,var(--sc));
    background:var(--paper); border:2.5px solid var(--ink); width:max-content;
  }
  .sc{
    border:0.5px solid var(--rule); display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:calc(var(--sc)*.52); font-weight:600; cursor:pointer;
    background:var(--paper); color:var(--nes-blue); position:relative; -webkit-user-select:none; user-select:none;
  }
  .sc.br{ border-right:2.5px solid var(--ink); } .sc.bb{ border-bottom:2.5px solid var(--ink); }
  .sc.given{ color:var(--ink); }
  .sc.sel{ background:#cfe0f5; }
  .sc.peer{ background:#eaf1fb; }
  .sc.hl{ background:#dbe7fa; }
  .sc.bad{ background:#f6d2d0; color:var(--nes-red); }
  .notes{ display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); width:100%; height:100%; }
  .notes span{ font-size:calc(var(--sc)*.24); color:var(--ink-faint); display:flex; align-items:center; justify-content:center; font-weight:400; }
  .pad{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; width:min(360px,90vw); margin-top:16px; }
  .pad button{ font-family:var(--pixel); font-size:15px; border:1.5px solid var(--ink); background:var(--paper-hi); color:var(--ink); padding:14px 0; cursor:pointer; }
  .pad button:hover{ background:var(--ink); color:var(--paper); }
  .pad button.wide{ grid-column:span 1; font-family:var(--mono); font-size:12px; }
  #pencilBtn[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<div id="app">
  <header class="masthead">
    <a class="brand" href="../">BORED GAMES <em>&nbsp;a small game collection</em></a>
    <div class="status"><span id="clock"></span><span>no ads · offline</span><span class="battery"></span></div>
  </header>

  <div class="toolbar"><a class="backlink" href="../">← all games</a></div>
  <div class="game-head">
    <h1>Sudoku</h1>
    <p>Every row, column and 3×3 box holds one to nine, once each. Tap a cell and type a number. Toggle pencil to jot notes.</p>
  </div>

  <div class="diff-row" id="diff" role="group" aria-label="Difficulty"></div>
  <div class="hud">
    <div class="stat"><span class="l">Time</span><span class="n" id="time">0</span></div>
    <div class="stat"><span class="l">Empty</span><span class="n" id="empty">0</span></div>
  </div>

  <div class="stage">
    <div class="sudoku" id="grid"></div>
    <div class="overlay hide" id="overlay">
      <div class="big">Solved!</div>
      <div class="sub" id="overSub"></div>
      <button class="act" id="overBtn">New puzzle</button>
    </div>
  </div>

  <div class="pad" id="pad"></div>
  <div class="controls" style="margin-top:12px">
    <button class="act ghost" id="pencilBtn" aria-pressed="false">✏️ Pencil: off</button>
    <button class="act ghost" id="newGame">New puzzle</button>
  </div>

  <footer><span>Bored Games</span><span><a href="../">← all games</a></span></footer>
</div>

<script>
// ---- generator (validated) ----
function okAt(g,r,c,n){
  for(let i=0;i<9;i++){ if(g[r][i]===n||g[i][c]===n) return false; }
  const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++) if(g[br+i][bc+j]===n) return false;
  return true;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function solvedGrid(){
  const g=Array.from({length:9},()=>new Array(9).fill(0));
  (function fill(pos){
    if(pos===81) return true;
    const r=Math.floor(pos/9), c=pos%9;
    for(const n of shuffle([1,2,3,4,5,6,7,8,9])){ if(okAt(g,r,c,n)){ g[r][c]=n; if(fill(pos+1)) return true; g[r][c]=0; } }
    return false;
  })(0);
  return g;
}
function countSolutions(g, limit){
  const b=g.map(r=>r.slice()); let count=0;
  (function solve(){
    let r=-1,c=-1;
    for(let i=0;i<81&&r<0;i++){ if(b[Math.floor(i/9)][i%9]===0){ r=Math.floor(i/9); c=i%9; } }
    if(r<0){ count++; return; }
    for(let n=1;n<=9&&count<limit;n++){ if(okAt(b,r,c,n)){ b[r][c]=n; solve(); b[r][c]=0; } }
  })();
  return count;
}
function makePuzzle(target){
  const sol=solvedGrid(); const puz=sol.map(r=>r.slice());
  const cells=shuffle([...Array(81).keys()]); let givens=81;
  for(const idx of cells){
    if(givens<=target) break;
    const r=Math.floor(idx/9), c=idx%9, saved=puz[r][c];
    puz[r][c]=0;
    if(countSolutions(puz,2)!==1) puz[r][c]=saved; else givens--;
  }
  return {sol,puz};
}

// ---- game ----
const DIFFS={ Easy:44, Medium:34, Hard:27 };
let diffName="Easy";
const gridEl=document.getElementById("grid"), padEl=document.getElementById("pad");
const timeEl=document.getElementById("time"), emptyEl=document.getElementById("empty");
const overlay=document.getElementById("overlay"), overSub=document.getElementById("overSub");

let solution, given, cells, sel, pencil, seconds, timer, started, solved;

function buildDiff(){
  const el=document.getElementById("diff");
  el.innerHTML=Object.keys(DIFFS).map(d=>`<button class="filter-btn" data-d="${d}" aria-pressed="${d===diffName}">${d}</button>`).join("");
  el.querySelectorAll("button").forEach(b=> b.onclick=()=>{ diffName=b.dataset.d; buildDiff(); newGame(); });
}

function newGame(){
  const {sol,puz}=makePuzzle(DIFFS[diffName]);
  solution=sol; given=puz.map(r=>r.map(v=>v!==0));
  cells=puz.map(r=>r.map(v=>({val:v, notes:new Set()})));
  sel=null; pencil=false; seconds=0; started=false; solved=false;
  document.getElementById("pencilBtn").setAttribute("aria-pressed","false");
  document.getElementById("pencilBtn").textContent="✏️ Pencil: off";
  clearInterval(timer); timeEl.textContent=0;
  overlay.classList.add("hide");
  render();
}

function startTimer(){ if(started) return; started=true; timer=setInterval(()=>{ seconds++; timeEl.textContent=seconds; },1000); }

function conflicts(){
  // returns Set of "r,c" that clash
  const bad=new Set();
  const check=(list)=>{ const seen={}; for(const [r,c] of list){ const v=cells[r][c].val; if(!v) continue; (seen[v]=seen[v]||[]).push([r,c]); }
    for(const v in seen){ if(seen[v].length>1) seen[v].forEach(([r,c])=>bad.add(r+","+c)); } };
  for(let r=0;r<9;r++) check([...Array(9)].map((_,c)=>[r,c]));
  for(let c=0;c<9;c++) check([...Array(9)].map((_,r)=>[r,c]));
  for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++){ const l=[]; for(let i=0;i<3;i++)for(let j=0;j<3;j++) l.push([br*3+i,bc*3+j]); check(l); }
  return bad;
}

function render(){
  gridEl.innerHTML="";
  const bad=conflicts();
  let empties=0;
  const selVal = sel ? cells[sel[0]][sel[1]].val : 0;
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const cell=cells[r][c];
    if(!cell.val) empties++;
    const d=document.createElement("div");
    d.className="sc";
    if(c%3===2 && c<8) d.classList.add("br");
    if(r%3===2 && r<8) d.classList.add("bb");
    if(given[r][c]) d.classList.add("given");
    if(sel && sel[0]===r && sel[1]===c) d.classList.add("sel");
    else if(sel && (sel[0]===r || sel[1]===c || (Math.floor(sel[0]/3)===Math.floor(r/3) && Math.floor(sel[1]/3)===Math.floor(c/3)))) d.classList.add("peer");
    if(selVal && cell.val===selVal) d.classList.add("hl");
    if(bad.has(r+","+c)) d.classList.add("bad");
    if(cell.val){ d.textContent=cell.val; }
    else if(cell.notes.size){
      const n=document.createElement("div"); n.className="notes";
      for(let k=1;k<=9;k++){ const s=document.createElement("span"); s.textContent=cell.notes.has(k)?k:""; n.appendChild(s); }
      d.appendChild(n);
    }
    d.onclick=()=>{ sel=[r,c]; render(); };
    gridEl.appendChild(d);
  }
  emptyEl.textContent=empties;
}

function enter(n){
  if(!sel || solved) return;
  const [r,c]=sel; if(given[r][c]) return;
  startTimer();
  const cell=cells[r][c];
  if(pencil && n!==0){
    if(cell.val) cell.val=0;
    if(cell.notes.has(n)) cell.notes.delete(n); else cell.notes.add(n);
  }else{
    cell.val = (cell.val===n ? 0 : n);
    if(cell.val) cell.notes.clear();
  }
  render();
  checkWin();
}
function erase(){ if(!sel||solved) return; const [r,c]=sel; if(given[r][c]) return; cells[r][c].val=0; cells[r][c].notes.clear(); render(); }

function checkWin(){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++) if(cells[r][c].val!==solution[r][c]) return;
  solved=true; clearInterval(timer);
  overSub.textContent=`Filled in ${seconds}s on ${diffName}.`;
  overlay.classList.remove("hide");
}

function buildPad(){
  padEl.innerHTML="";
  for(let n=1;n<=9;n++){ const b=document.createElement("button"); b.textContent=n; b.onclick=()=>enter(n); padEl.appendChild(b); }
  const er=document.createElement("button"); er.className="wide"; er.textContent="Erase"; er.onclick=erase; padEl.appendChild(er);
}

window.addEventListener("keydown", e=>{
  if(/^[1-9]$/.test(e.key)) enter(+e.key);
  else if(e.key==="Backspace"||e.key==="Delete"||e.key==="0") erase();
  else if(e.key.startsWith("Arrow") && sel){
    let [r,c]=sel;
    if(e.key==="ArrowUp") r=(r+8)%9; if(e.key==="ArrowDown") r=(r+1)%9;
    if(e.key==="ArrowLeft") c=(c+8)%9; if(e.key==="ArrowRight") c=(c+1)%9;
    sel=[r,c]; render(); e.preventDefault();
  }
});
document.getElementById("pencilBtn").onclick=(e)=>{ pencil=!pencil; e.target.setAttribute("aria-pressed",pencil); e.target.textContent="✏️ Pencil: "+(pencil?"on":"off"); };
document.getElementById("newGame").onclick=newGame;
document.getElementById("overBtn").onclick=newGame;

function tick(){ const d=new Date(); document.getElementById("clock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
tick(); setInterval(tick,15000);
const flash=document.getElementById("flash");
requestAnimationFrame(()=>flash.classList.add("go"));
flash.addEventListener("animationend",()=>flash.classList.remove("go"));

buildDiff(); buildPad(); newGame();
</script>
</body>
</html>
