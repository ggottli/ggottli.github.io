<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Bored Games</title>
<meta name="description" content="Snake — eat, grow, don't bite yourself. Part of Bored Games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  :root{ --accent: var(--nes-green); }
  .board{ border:1.5px solid var(--ink); background:#0f0f0d; touch-action:none; max-width:100%; height:auto; }
  .stage{ width:min(440px, 92vw); }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<div id="app">
  <header class="masthead">
    <a class="brand" href="../">BORED GAMES <em>&nbsp;a small game collection</em></a>
    <div class="status"><span id="clock"></span><span>no ads · offline</span><span class="battery"></span></div>
  </header>

  <div class="toolbar"><a class="backlink" href="../">← all games</a></div>
  <div class="game-head">
    <h1>Snake</h1>
    <p>Arrow keys, WASD or swipe. Eat the dots to grow. Walls and your own tail are fatal.</p>
  </div>

  <div class="hud">
    <div class="stat"><span class="l">Score</span><span class="n" id="score">0</span></div>
    <div class="stat"><span class="l">Best</span><span class="n" id="best">0</span></div>
  </div>

  <div class="stage">
    <canvas class="board" id="board" width="420" height="420" aria-label="Snake board"></canvas>
    <div class="overlay hide" id="overlay">
      <div class="big" id="overMsg">Ready?</div>
      <div class="sub" id="overSub">Press an arrow key or swipe to start.</div>
      <button class="act" id="overBtn">Start</button>
    </div>
  </div>

  <div class="controls">
    <button class="act ghost" id="newGame">New game</button>
    <button class="act ghost" id="pauseBtn">Pause</button>
    <button class="act ghost" id="soundBtn" aria-pressed="false">Sound: off</button>
  </div>

  <div class="dpad">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="right" data-dir="right">→</button>
    <button class="down" data-dir="down">↓</button>
  </div>

  <footer><span>Bored Games</span><span><a href="../">← all games</a></span></footer>
</div>

<script>
const GRID = 21, CELL = 20;
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
canvas.width = GRID*CELL; canvas.height = GRID*CELL;
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("overlay");
const overMsg = document.getElementById("overMsg");
const overSub = document.getElementById("overSub");

let snake, dir, nextDir, food, score, best, running, paused, dead, tickMs, acc, last, started;
best = +(localStorage.getItem("bg_snake_best") || 0);
bestEl.textContent = best;

// --- tiny sound (off by default) ---
let soundOn = false, actx = null;
function beep(freq, dur){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.value = 0.05; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

function reset(){
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir;
  placeFood(); score = 0; tickMs = 130; acc = 0; last = 0;
  dead = false; paused = false; started = false; running = true;
  scoreEl.textContent = 0;
  overMsg.textContent = "Ready?"; overSub.textContent = "Press an arrow key or swipe to start.";
  overlay.classList.remove("hide");
  draw();
}

function placeFood(){
  while(true){
    const f = {x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID)};
    if(!snake.some(s=>s.x===f.x && s.y===f.y)){ food = f; return; }
  }
}

function startIfNeeded(){
  if(started) return;
  started = true; overlay.classList.add("hide");
}

function setDir(nx,ny){
  // no reversing directly
  if(nx === -dir.x && ny === -dir.y) return;
  nextDir = {x:nx, y:ny};
  startIfNeeded();
}

function step(){
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if(head.x<0 || head.x>=GRID || head.y<0 || head.y>=GRID || snake.some(s=>s.x===head.x && s.y===head.y)){
    return die();
  }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score += 1; scoreEl.textContent = score;
    beep(660, .05);
    if(tickMs > 60) tickMs -= 2;
    placeFood();
  }else{
    snake.pop();
  }
}

function die(){
  dead = true; running = false;
  beep(140, .18);
  if(score > best){ best = score; localStorage.setItem("bg_snake_best", best); bestEl.textContent = best; }
  overMsg.textContent = "Game over";
  overSub.textContent = `You grew to ${score}. ${score>=best?"New best!":"Best is "+best+"."}`;
  overlay.classList.remove("hide");
}

function draw(){
  ctx.fillStyle = "#0f0f0d"; ctx.fillRect(0,0,canvas.width,canvas.height);
  // faint grid
  ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1;
  for(let i=1;i<GRID;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
  }
  // food
  drawCell(food.x, food.y, "#E43B44");
  // snake
  snake.forEach((s,i)=>{
    drawCell(s.x, s.y, i===0 ? "#62C64B" : "#3E8948");
  });
}

function drawCell(gx, gy, color){
  const x = gx*CELL, y = gy*CELL, p = 2;
  ctx.fillStyle = color;
  ctx.fillRect(x+p, y+p, CELL-2*p, CELL-2*p);
  // 8-bit bevel
  ctx.fillStyle = "rgba(255,255,255,0.30)";
  ctx.fillRect(x+p, y+p, CELL-2*p, 3);
  ctx.fillRect(x+p, y+p, 3, CELL-2*p);
  ctx.fillStyle = "rgba(0,0,0,0.30)";
  ctx.fillRect(x+p, y+CELL-p-3, CELL-2*p, 3);
  ctx.fillRect(x+CELL-p-3, y+p, 3, CELL-2*p);
}

function loop(ts){
  if(!running){ return; }
  if(!last) last = ts;
  const dt = ts - last; last = ts;
  if(started && !paused){
    acc += dt;
    while(acc >= tickMs){ acc -= tickMs; step(); if(dead) break; }
  }
  draw();
  if(running) requestAnimationFrame(loop);
}

function newGame(){ reset(); requestAnimationFrame(loop); }

// input
const KEYS = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
               w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], W:[0,-1], S:[0,1], A:[-1,0], D:[1,0] };
window.addEventListener("keydown", e=>{
  if(KEYS[e.key]){ e.preventDefault(); setDir(KEYS[e.key][0], KEYS[e.key][1]); }
  else if(e.key===" "){ e.preventDefault(); togglePause(); }
});
document.querySelectorAll(".dpad button").forEach(b=>{
  const map = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  b.addEventListener("click", ()=>{ const m=map[b.dataset.dir]; setDir(m[0],m[1]); });
});

function togglePause(){
  if(dead || !started) return;
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "Resume" : "Pause";
}

document.getElementById("newGame").onclick = newGame;
document.getElementById("overBtn").onclick = ()=>{ if(dead) newGame(); else startIfNeeded(); };
document.getElementById("pauseBtn").onclick = togglePause;
document.getElementById("soundBtn").onclick = (e)=>{
  soundOn = !soundOn;
  e.target.textContent = "Sound: " + (soundOn?"on":"off");
  e.target.setAttribute("aria-pressed", soundOn);
};

// swipe
let sx=0, sy=0, tch=false;
canvas.addEventListener("touchstart", e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tch=true; }, {passive:true});
canvas.addEventListener("touchmove", e=>{ if(tch) e.preventDefault(); }, {passive:false});
canvas.addEventListener("touchend", e=>{
  if(!tch) return; tch=false;
  const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1);
});

// chrome
function tick(){ const d=new Date(); document.getElementById("clock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
tick(); setInterval(tick,15000);
const flash=document.getElementById("flash");
requestAnimationFrame(()=>flash.classList.add("go"));
flash.addEventListener("animationend",()=>flash.classList.remove("go"));

newGame();
</script>
</body>
</html>
