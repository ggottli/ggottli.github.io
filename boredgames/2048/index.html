<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Bored Games</title>
<meta name="description" content="2048 — slide the tiles, merge the numbers, chase 2048. Part of Bored Games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  :root{ --accent: var(--nes-orange); }
  .board{
    --gap: 10px;
    --board: min(360px, 88vw);
    --cell: calc((var(--board) - 5*var(--gap)) / 4);
    position:relative; width:var(--board); height:var(--board);
    background:var(--ink); border:1.5px solid var(--ink); padding:0;
    touch-action:none;
  }
  .cell-bg{ position:absolute; width:var(--cell); height:var(--cell); background:var(--paper); opacity:.5; }
  .tile{
    position:absolute; width:var(--cell); height:var(--cell);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--pixel); color:#fff; border:1.5px solid rgba(0,0,0,.35);
    transform: translate(
      calc(var(--gap) + var(--c) * (var(--cell) + var(--gap))),
      calc(var(--gap) + var(--r) * (var(--cell) + var(--gap)))
    );
    transition: transform .11s ease-in-out;
    will-change: transform;
  }
  .tile .v{ font-size:calc(var(--cell) * .30); line-height:1; }
  .tile.small .v{ font-size:calc(var(--cell) * .20); }
  .tile.tiny .v{ font-size:calc(var(--cell) * .15); }
  .tile.new{ animation:pop .14s ease-out; }
  .tile.merged{ animation:bump .14s ease-out; }
  @keyframes pop{ 0%{ transform:translate(calc(var(--gap) + var(--c)*(var(--cell)+var(--gap))), calc(var(--gap) + var(--r)*(var(--cell)+var(--gap)))) scale(.1); } 100%{} }
  @keyframes bump{ 0%{} 50%{ transform:translate(calc(var(--gap) + var(--c)*(var(--cell)+var(--gap))), calc(var(--gap) + var(--r)*(var(--cell)+var(--gap)))) scale(1.16); } 100%{} }

  /* 8-bit value colors */
  .v2{ background:#B7C6D6; color:var(--ink); } .v4{ background:#8FB0D6; color:var(--ink); }
  .v8{ background:var(--nes-cyan); } .v16{ background:var(--nes-blue); }
  .v32{ background:var(--nes-lime); color:var(--ink);} .v64{ background:var(--nes-green); }
  .v128{ background:var(--nes-yellow); color:var(--ink);} .v256{ background:var(--nes-orange); }
  .v512{ background:var(--nes-pink); } .v1024{ background:var(--nes-purple); }
  .v2048{ background:var(--nes-red); } .vbig{ background:var(--ink); }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<div id="app">
  <header class="masthead">
    <a class="brand" href="../">BORED GAMES <em>&nbsp;a small game collection</em></a>
    <div class="status"><span id="clock"></span><span>no ads · offline</span><span class="battery"></span></div>
  </header>

  <div class="toolbar"><a class="backlink" href="../">← all games</a></div>
  <div class="game-head">
    <h1>2048</h1>
    <p>Arrow keys or swipe to slide. Same numbers merge. Get a tile to 2048.</p>
  </div>

  <div class="hud">
    <div class="stat"><span class="l">Score</span><span class="n" id="score">0</span></div>
    <div class="stat"><span class="l">Best</span><span class="n" id="best">0</span></div>
  </div>

  <div class="stage">
    <div class="board" id="board" tabindex="0" aria-label="2048 board"></div>
    <div class="overlay hide" id="overlay">
      <div class="big" id="overMsg">Game over</div>
      <div class="sub" id="overSub"></div>
      <button class="act" id="overBtn">New game</button>
    </div>
  </div>

  <div class="controls">
    <button class="act ghost" id="newGame">New game</button>
  </div>

  <div class="dpad" aria-hidden="false">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="right" data-dir="right">→</button>
    <button class="down" data-dir="down">↓</button>
  </div>

  <footer><span>Bored Games</span><span><a href="../">← all games</a></span></footer>
</div>

<script>
const SIZE = 4;
const board = document.getElementById("board");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("overlay");
const overMsg = document.getElementById("overMsg");
const overSub = document.getElementById("overSub");

let grid, score, best, tileId, won, over;
best = +(localStorage.getItem("bg_2048_best") || 0);
bestEl.textContent = best;

// static background cells
for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
  const bg = document.createElement("div");
  bg.className = "cell-bg";
  bg.style.transform = `translate(calc(var(--gap) + ${c} * (var(--cell) + var(--gap))), calc(var(--gap) + ${r} * (var(--cell) + var(--gap))))`;
  board.appendChild(bg);
}

function empty(){ const g=[]; for(let r=0;r<SIZE;r++){ g.push(new Array(SIZE).fill(null)); } return g; }
function cells(){ const out=[]; for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(grid[r][c]) out.push(grid[r][c]); return out; }
function emptyCells(){ const out=[]; for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!grid[r][c]) out.push({r,c}); return out; }

function addRandom(){
  const spots = emptyCells();
  if(!spots.length) return;
  const {r,c} = spots[Math.floor(Math.random()*spots.length)];
  grid[r][c] = { id: tileId++, value: Math.random()<0.9?2:4, r, c, isNew:true };
}

function newGame(){
  grid = empty(); score = 0; tileId = 1; won = false; over = false;
  overlay.classList.add("hide");
  addRandom(); addRandom();
  render();
}

function render(){
  board.querySelectorAll(".tile").forEach(t=>t.remove());
  scoreEl.textContent = score;
  for(const t of cells()){
    const el = document.createElement("div");
    const digits = String(t.value).length;
    el.className = "tile v"+(t.value<=2048?t.value:"big") + (digits>=4?" tiny":digits===3?" small":"") +
                   (t.isNew?" new":"") + (t.merged?" merged":"");
    el.style.setProperty("--r", t.r);
    el.style.setProperty("--c", t.c);
    el.innerHTML = `<span class="v">${t.value}</span>`;
    board.appendChild(el);
    t.isNew = false; t.merged = false;
  }
}

function move(dir){
  if(over) return;
  const vec = {up:[-1,0], down:[1,0], left:[0,-1], right:[0,1]}[dir];
  const rows = [...Array(SIZE).keys()];
  const cols = [...Array(SIZE).keys()];
  if(vec[0]===1) rows.reverse();
  if(vec[1]===1) cols.reverse();
  let moved = false;

  const merged = empty(); // track merges this move
  for(const r of rows) for(const c of cols){
    const tile = grid[r][c];
    if(!tile) continue;
    let nr=r, nc=c;
    while(true){
      const tr=nr+vec[0], tc=nc+vec[1];
      if(tr<0||tr>=SIZE||tc<0||tc>=SIZE) break;
      if(grid[tr][tc]===null){ nr=tr; nc=tc; }
      else if(grid[tr][tc].value===tile.value && !merged[tr][tc]){ nr=tr; nc=tc; break; }
      else break;
    }
    if(nr===r && nc===c) continue;
    if(grid[nr][nc] && grid[nr][nc].value===tile.value){
      // merge
      grid[nr][nc].value *= 2;
      grid[nr][nc].merged = true;
      merged[nr][nc] = true;
      score += grid[nr][nc].value;
      if(grid[nr][nc].value===2048 && !won){ won = true; }
      grid[r][c] = null;
      tile.r = nr; tile.c = nc; // it slides into the merge target then is removed by re-render
    }else{
      grid[nr][nc] = tile; grid[r][c] = null;
      tile.r = nr; tile.c = nc;
    }
    moved = true;
  }

  if(moved){
    addRandom();
    render();
    if(best < score){ best = score; localStorage.setItem("bg_2048_best", best); bestEl.textContent = best; }
    if(won){ endGame(true); }
    else if(!movesLeft()){ endGame(false); }
  }
}

function movesLeft(){
  if(emptyCells().length) return true;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const v = grid[r][c].value;
    if(c+1<SIZE && grid[r][c+1].value===v) return true;
    if(r+1<SIZE && grid[r+1][c].value===v) return true;
  }
  return false;
}

function endGame(win){
  over = true;
  overMsg.textContent = win ? "2048!" : "Game over";
  overSub.textContent = win ? `You hit 2048 with ${score} points. Keep going or start fresh.` : `Final score ${score}.`;
  overlay.classList.remove("hide");
  // when winning let them keep playing after they close
  if(win){ over = false; }
}

// input
const KEYS = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
               w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right" };
window.addEventListener("keydown", e=>{
  if(KEYS[e.key]){ e.preventDefault(); move(KEYS[e.key]); }
});
document.getElementById("newGame").onclick = newGame;
document.getElementById("overBtn").onclick = newGame;
document.querySelectorAll(".dpad button").forEach(b=>{
  b.addEventListener("click", ()=> move(b.dataset.dir));
});

// swipe
let sx=0, sy=0, touching=false;
board.addEventListener("touchstart", e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; touching=true; }, {passive:true});
board.addEventListener("touchmove", e=>{ if(touching) e.preventDefault(); }, {passive:false});
board.addEventListener("touchend", e=>{
  if(!touching) return; touching=false;
  const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?"right":"left");
  else move(dy>0?"down":"up");
});

// chrome: clock + flash
function tick(){ const d=new Date(); document.getElementById("clock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
tick(); setInterval(tick,15000);
const flash=document.getElementById("flash");
requestAnimationFrame(()=>flash.classList.add("go"));
flash.addEventListener("animationend",()=>flash.classList.remove("go"));

newGame();
board.focus();
</script>
</body>
</html>
