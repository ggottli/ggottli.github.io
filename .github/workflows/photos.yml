name: Build photos

on:
  push:
    paths:
      - "portfolio/photos/**"
      - "scripts/build_photos.py"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Build photos.json and thumbnails
        run: |
          if [ -f portfolio/photos/photos.csv ]; then
            python scripts/build_photos.py --from-csv
          else
            python scripts/build_photos.py
          fi
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio/photos/photos.json portfolio/photos/photos.csv portfolio/photos/thumbs
          git diff --cached --quiet || (git commit -m "Rebuild photos data and thumbnails" && git push)
